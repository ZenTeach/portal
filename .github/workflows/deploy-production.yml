name: Deploy to production

on:
  push:
    branch:
      - master

jobs:
  build_and_deploy_frontend:
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    env:
      VUE_APP_API_ENDPOINT: https://service.portal.zenteach.co.uk/api/v1
      VUE_APP_CORS_ORIGIN: https://service.portal.zenteach.co.uk
      VUE_APP_SENTRY_DSN: https://6474c2d922534f9a9acc9a83b1553a5b@o328466.ingest.sentry.io/5417325
    steps:
      - uses: actions/checkout@v2
        with:
          submodules: true
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_GREEN_BAY_01C293B03 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "/client"
          api_location: ""
          output_location: "dist"

  deploy_backend:
    runs-on: ['ubuntu-latest']
    defaults:
      run:
        working-directory: backend
    env:
      RUNNER_ALLOW_RUNASROOT: 1
      SERVER_NAME: ${{ secrets.PRODUCTION_SERVER_IP }}
      REMOTE_USER: ${{ secrets.REMOTE_USER }}
      PYTHON-VERSION: "3.10"
      TMP_DIR: ./server/tmp
      PROMETHEUS_MULTIPROC_DIR: /tmp

    steps:
      - name: Check out repository code
        uses: actions/checkout@v2

      - name: Set up Python ${{ env.PYTHON-VERSION }}
        uses: actions/setup-python@v2
        with:
          python-version: ${{ env.PYTHON-VERSION }}

      - name: Execute deploy script
        run: cd scripts/ && ./deploy-to-prod.sh

      - name: Get current git tag
        id: current_tag
        run: |
          echo "::set-output name=tag_information::$(git describe --tags)"

      - name: Send Release to Sentry
        uses: dmandrade/sentry-release-github-action@v1
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: zenteach
          SENTRY_PROJECT: backend_prod
        with:
          version: ${{ steps.current_tag.outputs.tag_information }}
