name: Deploy to production

on:
  deployment

jobs:
  deploy_frontend:
    runs-on: [self-hosted, production, deployment]
    defaults:
      run:
        working-directory: client/
    env:
      VUE_APP_API_ENDPOINT: https://service.portal.zenteach.co.uk/api/v1
      VUE_APP_SENTRY_DSN: https://6474c2d922534f9a9acc9a83b1553a5b@o328466.ingest.sentry.io/5417325
      VUE_CORS_API_ORIGIN: https://service.portal.zenteach.co.uk
      JUMPHOST_KEYS: ../backend/scripts/fabric_bastion_host_connection
      JUMPHOST: 18.132.248.142
      REMOTE_HOST_KEYS: ../backend/scripts/fabric_deploy_keys
      REMOTE_HOST2: 5.1.10.218
      REMOTE_USER: ubuntu
      REMOTE_DEST: /var/www/portal.zenteach.co.uk

    steps:
      - name: Check out repository code
        uses: actions/checkout@v2

      - name: Use Node.js
        uses: actions/setup-node@v1
        with:
          node-version: '13.13'

      - name: Install dependencies
        run: yarn install

      - name: Build distro
        run: yarn build

      - name: Copy files with SSH to Host ${{ env.REMOTE_HOST1 }}
        run: |
         chmod 400 $REMOTE_HOST_KEYS && chmod 400 $JUMPHOST_KEYS && scp -r -i $REMOTE_HOST_KEYS -o "StrictHostKeyChecking=no" ./dist $REMOTE_USER@$REMOTE_HOST1:$REMOTE_DEST

      - name: Copy files with SSH to Host ${{ env.REMOTE_HOST2 }}
        run: |
         chmod 400 $REMOTE_HOST_KEYS && chmod 400 $JUMPHOST_KEYS && scp -r -i $REMOTE_HOST_KEYS -o "StrictHostKeyChecking=no" ./dist $REMOTE_USER@$REMOTE_HOST2:$REMOTE_DEST

      - name: Copy files with SSH to Host ${{ env.REMOTE_HOST3 }}
        run: |
         chmod 400 $REMOTE_HOST_KEYS && chmod 400 $JUMPHOST_KEYS && scp -r -i $REMOTE_HOST_KEYS -o "StrictHostKeyChecking=no" ./dist $REMOTE_USER@$REMOTE_HOST3:$REMOTE_DEST


  deploy_backend:
    runs-on: [self-hosted, production, deployment]
    defaults:
      run:
        working-directory: backend
    env:
      PYTHON-VERSION: 3.7.5
      TMP_DIR: ./server/tmp

    steps:
      - name: Check out repository code
        uses: actions/checkout@v2

      - name: Set up Python ${{ env.PYTHON-VERSION }}
        uses: actions/setup-python@v2
        with:
          python-version: ${{ env.PYTHON-VERSION }}

      - name: Execute deploy script
        run: cd scripts/ && ./deploy-to-prod.sh
