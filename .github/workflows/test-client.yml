name: Client test CI

on:
  pull_request:
    paths:
      - 'client/**'

jobs:
  client:
    runs-on: ['ubuntu-latest']
    container: node:16.14-alpine
    defaults:
      run:
        working-directory: client
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
      - name: Install dependencies
        run: yarn install
      - name: Run unit test
        run: yarn test:unit
