version: "3.7"

services:
  zenteach_fe:
    restart: always
    build:
      context: ./client
      dockerfile: Dockerfile
    volumes:
      - "./client:/home/app"
      - "/home/app/node_modules"
    ports:
      - 8080:8080
    env_file:
      - './client/.env'
    depends_on:
      - zenteach_be
  zenteach_be:
    restart: always
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - './backend/.env.docker'
    volumes:
      - "./backend:/home/flask/server"
    ports:
      - 5000:5000
    environment:
      - FLASK_ENV=development
      - DATABASE_URL=postgres://zenteach:zenteach@zenteach_db:5432/zenteach_dev
      - DATABASE_TEST_URL=postgres://zenteach:zenteach@zenteach_db:5432/zenteach_test
      - APP_SETTINGS=server.config.DevelopmentConfig
      - CELERY_BROKER_URL=amqp://zenteach:zenteach_broker@rabbitmq_broker:5672/jobs
      - CELERY_RESULT_BACKEND=redis://redis_store:6379/0
      - REDIS_URL=redis://redis_store:6379/1
      - PRECOMMIT_CONFIG=/home/flask/server/.pre-commit-config.yaml
    depends_on:
      - zenteach_db
      - redis_store
      - rabbitmq_broker
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/api/v1/ping"]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 40s
    links:
      - "zenteach_db"
      - "redis_store"
      - "rabbitmq_broker"
  zenteach_db:
    build:
      context: ./backend/db
      dockerfile: Dockerfile
    ports:
      - 5432:5432
    environment:
      - POSTGRES_USER=zenteach
      - POSTGRES_PASSWORD=zenteach
  redis_store:
    image: redis:5.0.7-alpine
  rabbitmq_broker:
    image: rabbitmq:3.7.22-management-alpine
    ports:
      - "5672:5672"
    environment:
      - RABBITMQ_DEFAULT_USER=zenteach
      - RABBITMQ_ERLANG_COOKIE=va21ef9BSZz4WUVgcGcacmsIQ09qlh7VAKWOgfznaCg
      - RABBITMQ_DEFAULT_PASS=zenteach_broker
      - RABBITMQ_DEFAULT_VHOST=jobs
