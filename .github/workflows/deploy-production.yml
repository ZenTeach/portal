name: Deploy to production

on:
  push:
    branch:
      - master

jobs:
  build_and_deploy_frontend:
    runs-on: ubuntu-latest
    name: Deploy frontend
    defaults:
      run:
        working-directory: client/

    env:
      VUE_APP_API_ENDPOINT: https://api.zenteach.co.uk/api/v1
      VUE_APP_CORS_ORIGIN: https://api.zenteach.co.uk
      VUE_APP_SENTRY_DSN: https://6474c2d922534f9a9acc9a83b1553a5b@o328466.ingest.sentry.io/5417325
    steps:
      - uses: actions/checkout@v2
        with:
          submodules: true
      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 16.14

      - name: Install Yarn
        run: npm install -g yarn

      - name: Install dependencies
        run: yarn install

      - name: Build distro
        run: yarn build

      - name: Publish to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: "49747a4196a81b3af87f9a7f57327331"
          projectName: "portal"
          directory: "client/dist"
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

  deploy_backend:
    runs-on: ['ubuntu-latest']
    name: Deploy backend
    defaults:
      run:
        working-directory: backend
    env:
      RUNNER_ALLOW_RUNASROOT: 1
      SERVER_NAME: ${{ secrets.PRODUCTION_SERVER_IP }}
      REMOTE_USER: ${{ secrets.REMOTE_USER }}
      PYTHON-VERSION: "3.10"
      TMP_DIR: ./server/tmp
      PROMETHEUS_MULTIPROC_DIR: /tmp

    steps:
      - name: Check out repository code
        uses: actions/checkout@v2

      - name: Set up Python ${{ env.PYTHON-VERSION }}
        uses: actions/setup-python@v2
        with:
          python-version: ${{ env.PYTHON-VERSION }}

      - name: Execute deploy script
        run: cd scripts/ && ./deploy-to-prod.sh

      - name: Get current git tag
        id: current_tag
        run: |
          echo "::set-output name=tag_information::$(git describe --tags)"

      - name: Send Release to Sentry
        uses: dmandrade/sentry-release-github-action@v1
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: zenteach
          SENTRY_PROJECT: backend_prod
        with:
          version: ${{ steps.current_tag.outputs.tag_information }}
