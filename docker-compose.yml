version: "3.7"

services:
  zenteach_fe:
    restart: always
    build:
      context: ./src/client
      dockerfile: Dockerfile
    volumes:
      - "./src/client:/home/app"
      - "/home/app/node_modules"
    ports:
      - 8080:8080
    env_file:
      - './src/client/.env'
    depends_on:
      - zenteach_be
  zenteach_be:
    restart: always
    build:
      context: ./src/backend
      dockerfile: Dockerfile
    env_file:
      - './src/backend/.env'
    volumes:
      - "./src/backend:/home/flask/server"
    ports:
      - 5001:5000
    environment:
      - FLASK_ENV=development
      - DATABASE_URL=postgres://zenteach:zenteach@zenteach_db:5432/zenteach_dev
      - DATABASE_TEST_URL=postgres://zenteach:zenteach@zenteach_db:5432/zenteach_test
      - APP_SETTINGS=server.config.DevelopmentConfig
      - CELERY_BROKER_URL=redis://redis_store:6379
      - CELERY_RESULT_BACKEND=redis://redis_store:6379
    depends_on:
      - zenteach_db
      - redis_store
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/api/v1/ping"]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 40s
  zenteach_db:
    build:
      context: ./src/backend/db
      dockerfile: Dockerfile
    ports:
      - 5435:5432
    environment:
      - POSTGRES_USER=zenteach
      - POSTGRES_PASSWORD=zenteach
  redis_store:
    image: redis:5.0.7-alpine
    ports:
      - "6379:6379"

