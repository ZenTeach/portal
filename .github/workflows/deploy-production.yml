name: Deploy to production

on:
  release:
    types: [published]

jobs:
  deploy_frontend:
    runs-on: [self-hosted, production, deployment]
    defaults:
      run:
        working-directory: client/
    env:
      RUNNER_ALLOW_RUNASROOT: 1
      VUE_APP_API_ENDPOINT: https://service.portal.zenteach.co.uk/api/v1
      VUE_APP_CORS_ORIGIN: https://service.portal.zenteach.co.uk
      VUE_APP_SENTRY_DSN: https://6474c2d922534f9a9acc9a83b1553a5b@o328466.ingest.sentry.io/5417325
      JUMPHOST_KEYS: ../backend/scripts/fabric_bastion_host_connection
      JUMPHOST: 18.132.248.142
      REMOTE_HOST_KEYS: ../backend/scripts/fabric_deploy_keys
      REMOTE_HOST: ${{ secrets.PRODUCTION_SERVER_IP }}
      REMOTE_USER: ubuntu
      REMOTE_DEST: /var/www/portal.zenteach.co.uk

    steps:
      - name: Check out repository code
        uses: actions/checkout@v2

      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 16.14
          cache: 'yarn'
          cache-dependency-path: '**/yarn.lock'

      - name: Install Yarn
        run: npm install -g yarn

      - name: Install dependencies
        run: yarn install

      - name: Build distro
        run: yarn build

      - name: Copy files with SSH to Host ${{ env.REMOTE_HOST }}
        run: |
         chmod 400 $REMOTE_HOST_KEYS && chmod 400 $JUMPHOST_KEYS && scp -r -i $REMOTE_HOST_KEYS -o "StrictHostKeyChecking=no" ./dist $REMOTE_USER@$REMOTE_HOST:$REMOTE_DEST

      - name: Uninstall Yarn
        if: always()
        run: npm uninstall -g yarn

  deploy_backend:
    runs-on: [self-hosted, production, deployment]
    defaults:
      run:
        working-directory: backend
    env:
      RUNNER_ALLOW_RUNASROOT: 1
      SERVER_NAME: ${{ secrets.PRODUCTION_SERVER_IP }}
      PYTHON-VERSION: 3.7.5
      TMP_DIR: ./server/tmp

    steps:
      - name: Check out repository code
        uses: actions/checkout@v2

      - name: Set up Python ${{ env.PYTHON-VERSION }}
        uses: actions/setup-python@v2
        with:
          python-version: ${{ env.PYTHON-VERSION }}

      - name: Execute deploy script
        run: cd scripts/ && ./deploy-to-prod.sh
