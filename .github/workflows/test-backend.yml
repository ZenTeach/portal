name: Backend test CI

on:
  pull_request:
    branches: [ master ]

jobs:
  backend:
    runs-on: [ self-hosted, ci ]
    container: python:3.7.5-slim-stretch
    env:
      DATABASE_TEST_URL: postgres://zenteach:cipass@postgres:5432/zenteach
      FLASK_ENV: test
      APP_SETTINGS: server.config.TestingConfig
      REDIS_URL: redis://redis:6379/app
      AUTHLIB_INSECURE_TRANSPORT: true
      CLIENT_URL: http://localhost:8080
      TMP_DIR: /tmp
      AWS_QUESTIONS_BUCKET: test-question-assets-bucket
      AWS_REGION: "eu-west-2"
    defaults:
      run:
        working-directory: backend
    services:
      redis:
        image: redis:5.0.7-alpine
        ports:
          - 6379:6379
      postgres:
        image: postgres:11.2-alpine
        ports:
          - 5432:5432
        env:
          POSTGRES_DB: zenteach
          POSTGRES_USER: zenteach
          POSTGRES_PASSWORD: cipass
        volumes:
          - postgresql.conf:/etc/postgresql/postgresql.conf
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Check out repository code
        uses: actions/checkout@v2
      - name: Install packages
        run: |
          echo "deb http://apt.postgresql.org/pub/repos/apt/ stretch-pgdg main" >> /etc/apt/sources.list.d/pgdg.list && \
          echo "deb http://deb.debian.org/debian stretch-backports main" >> /etc/apt/sources.list.d/sources.list && \
          apt-get update && \
          apt-get install -y build-essential sudo python3-dev python3-pip python3-setuptools python3-wheel python3-cffi && \
          apt-get install -y libcairo2 libpango-1.0-0 libpangocairo-1.0-0 && \
          apt-get install -y libgdk-pixbuf2.0-0 libffi-dev shared-mime-info libnss3-dev libx11-xcb1 &&  \
          apt-get install -y gfortran wget unzip curl zlib1g zlib1g-dev && \
          apt-get install -y libfreetype6 libfreetype6-dev libpng-dev libopenblas-dev && \
          apt-get install -y netcat-openbsd libssl-dev python3-scipy libcurl4-openssl-dev python-pycurl && \
          apt-get install -y shared-mime-info libjpeg-dev fonts-open-sans
          wget --quiet -O - https://www.postgresql.org/media/keys/ACCC4CF8.asc | apt-key add - && \
          apt-get update && apt-get install -y libpq-dev && pip install pipenv

      - name: Install Google Chrome Binary
        run: |
          cd /tmp && wget https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb && \
          apt-get install -y ./google-chrome-stable_current_amd64.deb

      - name: Setup Chromedriver
        uses: nanasess/setup-chromedriver@master
        with:
          chromedriver-version: '87.0.4280.20'

      - name: Setup display adapters
        run: |
          export DISPLAY=:99
          chromedriver --url-base=/wd/hub &
          sudo Xvfb -ac :99 -screen 0 1280x1024x24 > /dev/null 2>&1 &

      - name: Install dependencies
        run: pipenv install

      - name: Run migrations
        run: pipenv run python manage.py db upgrade

      - name: Run db configuration
        run: pipenv run python manage.py db_conf

      - name: Run unit tests
        run: |
          pipenv run pytest --timeout 600 --cov=server/ -m "not e2e"
      - name: Run e2e
        run: |
          pipenv run pytest --timeout 600 --driver Chrome -m e2e
