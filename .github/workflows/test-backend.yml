name: Backend test CI

on:
  pull_request:
    paths:
      - 'backend/**'

jobs:
  backend:
    runs-on: [self-hosted, ci]
    container: python:3.10-bullseye
    env:
      DATABASE_TEST_URL: postgresql://zenteach:cipass@postgres:5432/zenteach
      RUNTIME: test
      APP_SETTINGS: server.config.TestingConfig
      REDIS_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      CELERY_BROKER_URL: amqp://zenteach:zenteach_broker@rabbitmq:5672/jobs
      AUTHLIB_INSECURE_TRANSPORT: true
      CLIENT_URL: http://localhost:8080
      TMP_DIR: /tmp
      TEMPLATE_DIR: server/templates
      DEFAULT_MAIL_SENDER: test_sender@example.com
      AWS_QUESTIONS_BUCKET: test-question-assets-bucket
      AWS_REGION: "eu-west-2"
    defaults:
      run:
        working-directory: backend
    services:
      redis:
        image: redis:5.0.7-alpine
        ports:
          - 6379:6379
      postgres:
        image: postgres:12.7-alpine
        ports:
          - 5432:5432
        env:
          POSTGRES_DB: zenteach
          POSTGRES_USER: zenteach
          POSTGRES_PASSWORD: cipass
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      rabbitmq:
        image: rabbitmq:alpine
        ports:
          - 5672:5672
        env:
          RABBITMQ_DEFAULT_USER: zenteach
          RABBITMQ_ERLANG_COOKIE: va21ef9BSZz4WUVgcGcacmsIQ09qlh7VAKWOgfznaCg
          RABBITMQ_DEFAULT_PASS: zenteach_broker
          RABBITMQ_DEFAULT_VHOST: jobs
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Install packages
        run: |
          echo "deb http://apt.postgresql.org/pub/repos/apt/ bullseye-pgdg main" >> /etc/apt/sources.list.d/pgdg.list && \
          echo "deb http://deb.debian.org/debian bullseye-backports main" >> /etc/apt/sources.list.d/sources.list && \
          apt-get update && \
          apt-get install -y build-essential git sudo python3-dev python3-pip python3-setuptools python3-wheel python3-cffi && \
          apt-get install -y libcairo2 libpango-1.0-0 libpangocairo-1.0-0 && \
          apt-get install -y libgdk-pixbuf2.0-0 libffi-dev shared-mime-info libnss3-dev libx11-xcb1 &&  \
          apt-get install -y gfortran wget unzip curl zlib1g zlib1g-dev && \
          apt-get install -y libfreetype6 libfreetype6-dev libpng-dev libopenblas-dev && \
          apt-get install -y netcat-openbsd libssl-dev python3-scipy libcurl4-openssl-dev python-pycurl && \
          apt-get install -y shared-mime-info libjpeg-dev fonts-open-sans
          wget --quiet -O - https://www.postgresql.org/media/keys/ACCC4CF8.asc | apt-key add - && \
          apt-get update && apt-get install -y libpq-dev && pip install pipenv

      - name: Install dependecies
        uses: VaultVulp/action-pipenv@v2.0.1
        with:
          command: install -d

      - name: Run migrations
        uses: VaultVulp/action-pipenv@v2.0.1
        with:
          command: run python manage.py db upgrade

      - name: Run db configuration
        uses: VaultVulp/action-pipenv@v2.0.1
        with:
          command: run python manage.py db_conf

     - name: Run tests
        uses: VaultVulp/action-pipenv@v2.0.1
        with:
          command: run pytest --timeout 600 --cov=server/ --driver Chrome -m "not e2e"
