import com.bmuschko.gradle.docker.tasks.image.*
import com.bmuschko.gradle.docker.tasks.container.*
import com.bmuschko.gradle.docker.tasks.network.*

buildscript {
    repositories {
        gradlePluginPortal()
		maven {
     		url "https://plugins.gradle.org/m2/"
    	}
    }
    dependencies {
        classpath 'com.bmuschko:gradle-docker-plugin:6.1.1'
		classpath "gradle.plugin.com.patdouble:gradle-aws-ecr-plugin:0.6.0"
    }
}

apply plugin: com.bmuschko.gradle.docker.DockerRemoteApiPlugin
apply plugin: "com.patdouble.awsecr"



String getConfigurationProperty(String envVar, String sysProp) {
    System.getenv(envVar) ?: project.findProperty(sysProp)
}

def timestamp = { new Date().format('yyyyMMddHHmmssSSS') }
def buildTimestamp = timestamp()
def repoURL = {String repo -> "${getConfigurationProperty('AWS_ACCOUNT_ID', '')}.dkr.ecr.${getConfigurationProperty('AWS_DEFAULT_REGION', '')}.amazonaws.com/zenteach"}

def imageBuildTag = { "${repoURL()}:${buildTimestamp}" }


task buildImage(type: DockerBuildImage) {
    inputDir = file("../backend")
    dockerFile = file("Dockerfile.ci")
    images.add("${imageBuildTag()}")
    remove = true
	noCache = true

    onComplete {
        println "Completed building the Image"
    }

}

task buildNetwork(type: DockerCreateNetwork) {
	networkId = "backend_test_network"
}

task pullDBImage(type: DockerPullImage) {
	image='postgres:11.2-alpine'
}

task createDBContainer(type: DockerCreateContainer) {
	dependsOn buildNetwork, pullDBImage
    targetImageId pullDBImage.getImage()
    containerName = 'test_db'
	envVars.put('POSTGRES_DB', 'zenteach')
	envVars.put('POSTGRES_USER', 'zenteach')
	envVars.put('POSTGRES_PASSWORD', 'zenteach')
    hostConfig.autoRemove = true
	hostConfig.network = buildNetwork.getNetworkId()
}

task runDBContainer(type: DockerStartContainer) {
	dependsOn createDBContainer
	containerId = createDBContainer.containerId
}

task pullRedisImage(type: DockerPullImage) {
	image='redis:5.0.7-alpine'
}
task createRedisContainer(type: DockerCreateContainer) {
    dependsOn buildNetwork, pullRedisImage
	targetImageId pullRedisImage.getImage()
    containerName = 'redis'
    hostConfig.autoRemove = true
	hostConfig.network = buildNetwork.getNetworkId()
}

task runRedisContainer(type: DockerStartContainer) {
	dependsOn createRedisContainer
	containerId = createRedisContainer.containerId
}

task pullRabbitMQImage(type: DockerPullImage) {
	image="rabbitmq:3.7.22-management-alpine"
}

task createRabbitMQContainer(type: DockerCreateContainer) {
	dependsOn buildNetwork
    targetImageId pullRabbitMQImage.getImage()
    containerName = 'task_queue'
	envVars.put('RABBITMQ_DEFAULT_USER', 'zenteach')
	envVars.put('RABBITMQ_ERLANG_COOKIE', 'va21ef9BSZz4WUVgcGcacmsIQ09qlh7VAKWOgfznaCg')
	envVars.put('RABBITMQ_DEFAULT_PASS', 'zenteach_broker')
	envVars.put('RABBITMQ_DEFAULT_VHOST', 'jobs')
    hostConfig.autoRemove = true
	hostConfig.network = buildNetwork.getNetworkId()
}

task runRabbitMQContainer(type: DockerStartContainer) {
	dependsOn createRabbitMQContainer
	containerId = createRabbitMQContainer.containerId
}

task createAppContainer(type: DockerCreateContainer) {
    dependsOn buildImage, runDBContainer, runRabbitMQContainer, runRedisContainer, buildNetwork
    targetImageId buildImage.getImageId()
    hostConfig.portBindings = ['5000:5000']
	envVars.put('FLASK_ENV', 'CI')
	envVars.put('DATABASE_TEST_URL', 'postgres://zenteach:zenteach@zenteach_db:5432/zenteach')
	envVars.put('APP_SETTINGS', 'server.config.ProductionConfig')
	envVars.put('CELERY_BROKER_URL', 'mqp://zenteach:zenteach_broker@rabbitmq_broker:5672/jobs')
	envVars.put('CELERY_RESULT_BACKEND', 'redis://redis_store:6379/0')
	envVars.put('REDIS_URL', 'redis://redis_store:6379/app')
    hostConfig.autoRemove = true
    hostConfig.links = ["test_db:zenteach_db"]
	hostConfig.network = buildNetwork.getNetworkId()

    hostConfig.binds = ['/sys/fs/cgroup': '/sys/fs/cgroup']
    tty = true

    onError {exception ->
        throw exception
    }
    onComplete {
        println "Running container..."
    }
}

task startAppContainer(type: DockerStartContainer) {
    dependsOn createAppContainer
    targetContainerId createAppContainer.getContainerId()
}

task runTests(type: DockerExecContainer) {
    dependsOn startAppContainer
	targetContainerId createAppContainer.getContainerId()
	attachStdout = true
	withCommand(['python manage.py test'])
	withCommand(['python manage.py coverage'])
	successOnExitCodes = [0]
	onError {exception ->
		throw exception
	}
	finalizedBy "stopContainer"
	doLast {
    	logger.quiet "FOUND EXEC-IDS: " + execIds.get()
    }

	onComplete {
		println "Finished testing"
	}
}

task pushToECR(type: DockerPushImage) {
	dependsOn buildImage
	images.set(buildImage.images)

	onComplete {
		println "Finished pushing image..."
	}
}

task stopContainer(type: DockerStopContainer) {
	waitTime = 10
	targetContainerId createAppContainer.getContainerId()
	finalizedBy "deleteContainer"
}

task deleteContainer(type: DockerRemoveContainer) {
	dependsOn stopContainer
	targetContainerId createAppContainer.getContainerId()
	removeVolumes = true
	force = true
}

task deleteImage(type: DockerRemoveImage) {
	dependsOn deleteContainer
	targetImageId buildImage.getImageId()
	force = true
}
